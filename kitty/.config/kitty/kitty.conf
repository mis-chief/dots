# ~/.config/kitty/kitty.conf

# ── Font ───────────────────────────────────────────────
# The Nerd Font build adds the icons used by the fastfetch landing screen.
# If you only have plain JetBrains Mono, change this to: JetBrains Mono
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
# Turn on JetBrains Mono's coding ligatures (=> != ===)
disable_ligatures never

# ── Translucent background ─────────────────────────────
background_opacity         0.9
# Lets you change opacity live with ctrl+shift+a then m / l
dynamic_background_opacity yes
# Blur behind the window (macOS, and KDE/Hyprland on Linux)
background_blur            20

# ── Look & feel ────────────────────────────────────────
window_padding_width 12
hide_window_decorations no
cursor_shape         beam
cursor_trail         1
cursor_blink_interval 0.5
confirm_os_window_close 0
enable_audio_bell    no

# Tab bar
tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style slanted

# ── Colors (Catppuccin Mocha-style) ────────────────────
foreground           #CDD6F4
background           #1E1E2E
selection_foreground #1E1E2E
selection_background #F5E0DC
cursor               #F5E0DC
url_color            #89B4FA

active_tab_foreground   #11111B
active_tab_background   #CBA6F7
inactive_tab_foreground #CDD6F4
inactive_tab_background #181825

color0  #45475A
color8  #585B70
color1  #F38BA8
color9  #F38BA8
color2  #A6E3A1
color10 #A6E3A1
