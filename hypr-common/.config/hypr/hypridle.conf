general {
    lock_cmd = pidof hyprlock || hyprlock       # command used by "loginctl lock-session"
    before_sleep_cmd = loginctl lock-session    # lock before suspending
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # wake the screen after resume
}

# Lock after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn the screen off after 5.5 minutes
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })' # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # screen on when activity is detected
}

# Suspend after 10 minutes
listener {
    timeout = 600
    on-timeout = systemctl suspend
}
