general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.8
    contrast = 0.9
    vibrancy = 0.15
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    rounding = 25
    outer_color = rgb(89b4fa)
    inner_color = rgb(1e1e2e)
    font_color = rgb(cdd6f4)
    placeholder_text = Password...
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    color = rgb(cdd6f4)
    position = 0, 120
    halign = center
    valign = center
}
